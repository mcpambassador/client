name: Protocol Drift (advisory)

# Weekly: fails when src/protocol-types.ts has fallen behind server main and
# opens (or updates) a GitHub issue so the drift gets noticed.
# The blocking check (pinned SHA) lives in ci.yml.
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  drift-vs-main:
    name: Protocol types vs server main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Compare with server main
        run: node scripts/check-protocol.mjs --main

      - name: Open or update drift issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Protocol types drifted from server main"
          body="The weekly protocol-drift check failed: src/protocol-types.ts differs from server main. Re-copy packages/protocol/src/index.ts, update the // Source: header SHA, and run npm run check:protocol. Run: $RUN_URL"
          n=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number')
          if [ -n "$n" ]; then
            gh issue comment "$n" --body "Still drifting. $body"
          else
            gh issue create --title "$title" --body "$body"
          fi
