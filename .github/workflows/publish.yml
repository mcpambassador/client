name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 0.9.1 or 1.0.0)'
        required: true
        type: string
      tag:
        description: 'npm dist-tag'
        required: true
        default: 'beta'
        type: choice
        options:
          - beta
          - latest
          - next

jobs:
  validate-and-publish:
    name: Validate & Publish
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: write # push the v<version> tag only
      id-token: write # npm Trusted Publishing (OIDC) + provenance

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 10

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: pnpm

      # Trusted Publishing needs npm >= 11.5.1; Node 20 bundles npm 10.
      - name: Upgrade npm for Trusted Publishing
        run: |
          npm install -g npm@11.5.1
          npm --version

      - name: Verify version matches package.json and is unpublished
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$INPUT_VERSION" != "$PKG_VERSION" ]; then
            echo "ERROR: inputs.version ($INPUT_VERSION) != package.json version ($PKG_VERSION). Bump the version via PR first."
            exit 1
          fi
          if npm view "@mcpambassador/client@$PKG_VERSION" version >/dev/null 2>&1; then
            echo "ERROR: @mcpambassador/client@$PKG_VERSION already exists on npm."
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v$PKG_VERSION" >/dev/null 2>&1; then
            echo "ERROR: tag v$PKG_VERSION already exists."
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify zero production dependencies
        run: |
          DEPS=$(node -e "const p=require('./package.json'); const deps=p.dependencies||{}; console.log(Object.keys(deps).length)")
          if [ "$DEPS" != "0" ]; then
            echo "ERROR: Cannot publish with production dependencies. Aborting."
            exit 1
          fi

      - name: Run full CI checks
        run: |
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build

      - name: Publish (Trusted Publishing, provenance automatic)
        env:
          NPM_TAG: ${{ inputs.tag }}
        run: npm publish --tag "$NPM_TAG" --access public

      - name: Push release tag
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "v$INPUT_VERSION"
          git push origin "refs/tags/v$INPUT_VERSION"
